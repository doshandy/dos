<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据看板 Demo · DataPilot</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      body {
        overflow-y: auto;
      }
      .topbar {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-card);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .topbar h1 {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar .sub {
        color: var(--text-muted);
        font-size: 13px;
        margin-left: 10px;
      }
      .topbar a {
        font-size: 13px;
      }
      .dashboard {
        padding: 24px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }
      .kpi {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
      }
      .kpi .label {
        color: var(--text-muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .kpi .value {
        font-size: 24px;
        font-weight: 600;
        font-family: var(--mono);
        letter-spacing: -0.5px;
      }
      .kpi .delta {
        font-size: 12px;
        margin-top: 6px;
        display: inline-block;
      }
      .kpi .delta.up {
        color: var(--success);
      }
      .kpi .delta.down {
        color: #e06c75;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .chart-grid.row-2 {
        grid-template-columns: 1fr 1fr;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
      }
      .card h3 {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 4px;
      }
      .card .card-sub {
        color: var(--text-muted);
        font-size: 12px;
        margin-bottom: 16px;
      }
      .chart-box {
        height: 280px;
      }
      @media (max-width: 900px) {
        .kpi-row { grid-template-columns: repeat(2, 1fr); }
        .chart-grid, .chart-grid.row-2 { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div>
        <h1 style="display: inline">📊 数据看板</h1>
        <span class="sub">AntV G2 5.x · 多图表组合</span>
      </div>
      <a href="../index.html">← 返回简历</a>
    </div>

    <div class="dashboard">
      <div class="kpi-row">
        <div class="kpi">
          <div class="label">日活用户 DAU</div>
          <div class="value">1,284,910</div>
          <div class="delta down">↓ 3.2% vs 昨日</div>
        </div>
        <div class="kpi">
          <div class="label">订单总数</div>
          <div class="value">482,317</div>
          <div class="delta up">↑ 7.8% vs 昨日</div>
        </div>
        <div class="kpi">
          <div class="label">GMV (万元)</div>
          <div class="value">¥3,218.4</div>
          <div class="delta up">↑ 5.1% vs 昨日</div>
        </div>
        <div class="kpi">
          <div class="label">支付成功率</div>
          <div class="value">98.7%</div>
          <div class="delta up">↑ 0.3pp</div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="card">
          <h3>近 14 日 DAU 趋势</h3>
          <div class="card-sub">折线图 · 双指标对比（本期 vs 上期）</div>
          <div class="chart-box" id="chart-line"></div>
        </div>
        <div class="card">
          <h3>渠道分布</h3>
          <div class="card-sub">环形图 · 按来源渠道</div>
          <div class="chart-box" id="chart-donut"></div>
        </div>
      </div>

      <div class="chart-grid row-2">
        <div class="card">
          <h3>各业务线订单量</h3>
          <div class="card-sub">柱状图 · Top 6 业务线</div>
          <div class="chart-box" id="chart-bar"></div>
        </div>
        <div class="card">
          <h3>一周用户活跃热力</h3>
          <div class="card-sub">热力图 · 星期 × 小时</div>
          <div class="chart-box" id="chart-heatmap"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/@antv/g2@5.2.10/dist/g2.min.js"></script>
    <script>
      const theme = {
        view: { viewFill: 'transparent' },
        axis: {
          labelFill: '#8a92a6',
          lineStroke: '#242937',
          tickStroke: '#242937',
          gridStroke: '#1a1e29',
        },
        legend: {
          itemLabelFill: '#8a92a6',
          itemMarkerFillOpacity: 1,
        },
      };

      // ===== 折线图：近 14 日 DAU =====
      const days = Array.from({ length: 14 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (13 - i));
        return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });
      const lineData = [];
      days.forEach((d, i) => {
        lineData.push({ date: d, series: '本期', value: 1100000 + Math.sin(i / 2) * 80000 + i * 12000 + Math.random() * 40000 });
        lineData.push({ date: d, series: '上期', value: 980000 + Math.cos(i / 2.3) * 60000 + i * 9000 + Math.random() * 40000 });
      });
      const lineChart = new G2.Chart({ container: 'chart-line', autoFit: true, theme });
      lineChart.options({
        type: 'view',
        data: lineData,
        children: [
          {
            type: 'line',
            encode: { x: 'date', y: 'value', color: 'series' },
            scale: { color: { range: ['#4f8cff', '#8a92a6'] } },
            style: { lineWidth: 2, shadowColor: '#4f8cff', shadowBlur: 8 },
          },
          {
            type: 'point',
            encode: { x: 'date', y: 'value', color: 'series', shape: 'point' },
            style: { fillOpacity: 1, stroke: '#0b0d12', lineWidth: 1 },
            tooltip: false,
          },
        ],
        axis: {
          x: { labelFontSize: 11 },
          y: {
            labelFontSize: 11,
            labelFormatter: (v) => (v >= 1000000 ? (v / 1000000).toFixed(1) + 'M' : (v / 1000).toFixed(0) + 'k'),
          },
        },
      });
      lineChart.render();

      // ===== 环形图：渠道分布 =====
      const donutData = [
        { channel: '自然访问', value: 42 },
        { channel: '搜索引擎', value: 24 },
        { channel: '社交推广', value: 18 },
        { channel: '合作渠道', value: 10 },
        { channel: '其他', value: 6 },
      ];
      const donutChart = new G2.Chart({ container: 'chart-donut', autoFit: true, theme });
      donutChart.options({
        type: 'interval',
        data: donutData,
        coordinate: { type: 'theta', innerRadius: 0.62, outerRadius: 0.92 },
        encode: { y: 'value', color: 'channel' },
        transform: [{ type: 'stackY' }],
        scale: {
          color: { range: ['#4f8cff', '#3ecf8e', '#f5b86e', '#e06c75', '#b392f0'] },
        },
        style: { stroke: '#0b0d12', lineWidth: 2 },
        legend: { color: { position: 'right', itemLabelFontSize: 12 } },
        labels: [
          {
            text: (d) => `${d.channel} ${d.value}%`,
            position: 'outside',
            fontSize: 11,
            fill: '#e6e9f0',
            connector: true,
            connectorStroke: '#3a4158',
          },
        ],
      });
      donutChart.render();

      // ===== 柱状图：各业务线订单量 =====
      const barData = [
        { line: '消费分期', orders: 128400 },
        { line: '信用卡代偿', orders: 96210 },
        { line: '小额现金贷', orders: 88340 },
        { line: '车抵业务', orders: 54320 },
        { line: '保险分销', orders: 41800 },
        { line: '理财服务', orders: 32980 },
      ];
      const barChart = new G2.Chart({ container: 'chart-bar', autoFit: true, theme });
      barChart.options({
        type: 'interval',
        data: barData,
        coordinate: { transform: [{ type: 'transpose' }] },
        encode: { x: 'line', y: 'orders', color: 'line' },
        scale: {
          color: { range: ['#4f8cff', '#5b9bff', '#7aadff', '#a7c6ff', '#c3d7ff', '#dde7ff'] },
        },
        style: { radius: 4 },
        axis: {
          x: { labelFontSize: 11 },
          y: {
            labelFontSize: 11,
            labelFormatter: (v) => (v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v),
          },
        },
        legend: false,
        tooltip: {
          items: [
            { channel: 'y', valueFormatter: (v) => v.toLocaleString() + ' 单' },
          ],
        },
      });
      barChart.render();

      // ===== 热力图：一周用户活跃 =====
      const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
      const heatData = [];
      for (let d = 0; d < 7; d++) {
        for (let h = 0; h < 24; h++) {
          let base = 20;
          if (h >= 8 && h <= 22) base = 50 + Math.sin((h - 8) / 14 * Math.PI) * 45;
          if (d >= 5) base *= 0.75;
          heatData.push({
            day: weekDays[d],
            hour: String(h).padStart(2, '0'),
            value: Math.round(base + Math.random() * 15),
          });
        }
      }
      const heatChart = new G2.Chart({ container: 'chart-heatmap', autoFit: true, theme });
      heatChart.options({
        type: 'cell',
        data: heatData,
        encode: { x: 'hour', y: 'day', color: 'value' },
        scale: {
          color: { palette: 'blues' },
          y: { domain: weekDays },
        },
        style: { inset: 1, radius: 2 },
        axis: {
          x: { labelFontSize: 10, title: false },
          y: { labelFontSize: 11, title: false },
        },
        legend: { color: { itemLabelFontSize: 10 } },
        tooltip: {
          title: (d) => `周${d.day} ${d.hour}:00`,
          items: [{ channel: 'color', name: '活跃度' }],
        },
      });
      heatChart.render();

      // Resize handling
      window.addEventListener('resize', () => {
        [lineChart, donutChart, barChart, heatChart].forEach((c) => c.forceFit());
      });
    </script>
  </body>
</html>
